services:
  nginx:
    image: nginx:alpine
    container_name: feriaapp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Let's Encrypt certificates (issued on the host with certbot) for the
      # public domain. Read-only inside the container.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - public-web
    networks:
      - feriaapp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feriaapp-backend
    expose:
      - "5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/feriaApp
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      # Required for AI map detection (Claude). Without it /api/casetas/detect returns 503.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - mongo
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - feriaapp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feriaapp-frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - feriaapp-network

  public-web:
    build:
      context: ./public-web
      dockerfile: Dockerfile
    container_name: feriaapp-public
    expose:
      - "80"
    networks:
      - feriaapp-network

  mongo:
    image: mongo:7
    container_name: feriaapp-mongo
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - feriaapp-network

volumes:
  mongo-data:
  backend-uploads:

networks:
  feriaapp-network:
    driver: bridge