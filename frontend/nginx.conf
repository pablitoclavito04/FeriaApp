server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (e.g. index-AbC123.js) are immutable: their name
    # changes whenever the content changes, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html. It references the current hashed assets, so a
    # stale copy would point the browser at chunk files that no longer exist
    # after a deploy — which causes the SPA to hang on "Loading…". Always
    # revalidate it so every visit gets the asset names from the latest build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
