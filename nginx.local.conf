events {
    worker_connections 1024;
}

# LOCAL TESTING ONLY. Mirrors nginx.conf (the production config) but uses the
# self-signed certificate in nginx/ssl instead of Let's Encrypt, so the full
# subdomain split (feriaapp.com / admin.feriaapp.com) can be tested on Windows
# without the server's certificates. Add to your hosts file:
#   127.0.0.1 feriaapp.com www.feriaapp.com admin.feriaapp.com
# Production deploys keep using nginx.conf.

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 20m;

    server {
        listen 80;
        server_name feriaapp.com www.feriaapp.com admin.feriaapp.com localhost;
        return 301 https://$host$request_uri;
    }

    # PUBLIC WEBSITE — https://feriaapp.com
    server {
        listen 443 ssl;
        server_name feriaapp.com www.feriaapp.com;

        ssl_certificate     /etc/nginx/ssl/feriaapp.crt;
        ssl_certificate_key /etc/nginx/ssl/feriaapp.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /data/ {
            proxy_pass http://backend:5000/uploads/public-data/;
            proxy_set_header Host $host;
        }

        location /uploads/ {
            proxy_pass http://backend:5000/uploads/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://public-web:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ADMIN PANEL — https://admin.feriaapp.com
    server {
        listen 443 ssl;
        server_name admin.feriaapp.com;

        ssl_certificate     /etc/nginx/ssl/feriaapp.crt;
        ssl_certificate_key /etc/nginx/ssl/feriaapp.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://backend:5000/uploads/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }

    # Fallback (direct localhost without a matching host name): serve the panel.
    server {
        listen 443 ssl default_server;
        server_name localhost _;

        ssl_certificate     /etc/nginx/ssl/feriaapp.crt;
        ssl_certificate_key /etc/nginx/ssl/feriaapp.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://backend:5000/uploads/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}
