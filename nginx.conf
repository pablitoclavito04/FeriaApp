events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Allow large uploads: fair maps for AI detection can be several MB.
    # The default 1m causes a 413 on the /api/casetas/detect endpoint.
    client_max_body_size 20m;

    # AI map detection (POST /api/casetas/detect) can take a couple of minutes,
    # longer than nginx's 60s default, which would otherwise return 504. Allow
    # up to 200s for proxied responses.
    proxy_connect_timeout 200s;
    proxy_send_timeout    200s;
    proxy_read_timeout    200s;

    # ---------------------------------------------------------------------------
    # HTTP: redirect every host to its HTTPS equivalent.
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name feriaapp.com www.feriaapp.com admin.feriaapp.com localhost;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------------------
    # PUBLIC WEBSITE — https://feriaapp.com (and www).
    # Serves the public-web app. Its data (JSON) and images come from our own
    # backend, mirrored by the "Publish" button into the uploads volume, so the
    # site is fully served from this server (no GitHub Pages dependency).
    # Served at the domain root, app.js derives base path "/" and so expects
    # data at /data and images at /uploads.
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name feriaapp.com www.feriaapp.com;

        ssl_certificate     /etc/letsencrypt/live/feriaapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/feriaapp.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Published JSON data (fairs/casetas/menus/concerts), written locally by
        # the Publish action into the backend's uploads/public-data folder.
        location /data/ {
            proxy_pass http://backend:5000/uploads/public-data/;
            proxy_set_header Host $host;
        }

        # Uploaded images (caseta photos, fair maps) served by the backend.
        location /uploads/ {
            proxy_pass http://backend:5000/uploads/;
            proxy_set_header Host $host;
        }

        # The public-web static app.
        location / {
            proxy_pass http://public-web:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ---------------------------------------------------------------------------
    # ADMIN PANEL — https://admin.feriaapp.com
    # Serves the React admin frontend plus the API and raw uploads.
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name admin.feriaapp.com;

        ssl_certificate     /etc/letsencrypt/live/feriaapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/feriaapp.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded images (caseta photos, fair maps) served by the backend.
        location /uploads/ {
            proxy_pass http://backend:5000/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }

    # ---------------------------------------------------------------------------
    # Fallback for direct IP / localhost access (no domain): serve the panel.
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        server_name localhost _;

        ssl_certificate     /etc/letsencrypt/live/feriaapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/feriaapp.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://backend:5000/uploads/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}
