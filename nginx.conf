events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Allow large uploads: fair maps for AI detection can be several MB.
    # The default 1m causes a 413 on the /api/casetas/detect endpoint.
    client_max_body_size 20m;

    # HTTP server: redirects everything to HTTPS
    server {
        listen 80;
        server_name feriaapp.com www.feriaapp.com localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS server: serves the application
    server {
        listen 443 ssl;
        server_name feriaapp.com www.feriaapp.com localhost;

        # Let's Encrypt certificate for the public domain (trusted, no browser
        # warning). Falls back to the self-signed cert only if these are absent.
        ssl_certificate     /etc/letsencrypt/live/feriaapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/feriaapp.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded images (caseta photos, fair maps) served by the backend.
        location /uploads/ {
            proxy_pass http://backend:5000/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /public/ {
            proxy_pass http://public-web:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}
